name: Build + Publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    environment: prod
    env:
      HOME: /home/ghrunner
      PUBLIC_IS_PROD: ${{ secrets.PUBLIC_IS_PROD }}
      VITE_SANITY_GQL_API: ${{ secrets.VITE_SANITY_GQL_API }}
      PUBLIC_EMAILTO: ${{ secrets.PUBLIC_EMAILTO }}
      PUBLIC_BLOG_REPO: ${{ secrets.PUBLIC_BLOG_REPO }}
      PUBLIC_GH: ${{ secrets.PUBLIC_GH }}
      PUBLIC_DH: ${{ secrets.PUBLIC_DH }}
      PUBLIC_IG: ${{ secrets.PUBLIC_IG }}
      PUBLIC_LINKEDIN: ${{ secrets.PUBLIC_LINKEDIN }}
      PUBLIC_TWITTER: ${{ secrets.PUBLIC_TWITTER }}
      GITHUB_API_KEY: ${{ secrets.GH_API_KEY }}
      SANITY_API_KEY: ${{ secrets.SANITY_API_KEY }}
      SANITY_APP_ID: ${{ secrets.SANITY_APP_ID }}
      MOONBASE_URL: ${{ secrets.MOONBASE_URL }}
      HOMEWORLD_URL: ${{ secrets.HOMEWORLD_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build
        run: nice -n 10 bun run build

      - name: Deploy to Prod
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /var/www/html/planetoxy
          rsync -a --delete ./build/ /var/www/html/planetoxy/
          cat > /var/www/html/planetoxy/.env <<EOF
          PUBLIC_IS_PROD=$PUBLIC_IS_PROD
          VITE_SANITY_GQL_API=$VITE_SANITY_GQL_API
          PUBLIC_EMAILTO=$PUBLIC_EMAILTO
          PUBLIC_BLOG_REPO=$PUBLIC_BLOG_REPO
          PUBLIC_GH=$PUBLIC_GH
          PUBLIC_DH=$PUBLIC_DH
          PUBLIC_IG=$PUBLIC_IG
          PUBLIC_LINKEDIN=$PUBLIC_LINKEDIN
          PUBLIC_TWITTER=$PUBLIC_TWITTER
          GITHUB_API_KEY=$GITHUB_API_KEY
          SANITY_API_KEY=$SANITY_API_KEY
          SANITY_APP_ID=$SANITY_APP_ID
          MOONBASE_URL=$MOONBASE_URL
          HOMEWORLD_URL=$HOMEWORLD_URL
          EOF
          printf "import('./index.js')" > /var/www/html/planetoxy/start.cjs
          pm2 delete planetoxy 2>/dev/null || true
          pm2 start /var/www/html/planetoxy/start.cjs --name planetoxy --interpreter /home/ghrunner/.bun/bin/bun --cwd /var/www/html/planetoxy
          pm2 save
